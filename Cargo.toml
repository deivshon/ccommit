[package]
name = "ccommit"
version = "1.0.0"
edition = "2024"
description = "Conventional commits from the terminal"
license = "MIT"

[dependencies]
clap = { version = "4.6.4", features = ["derive"] }
jsonc-parser = { version = "0.33.1", features = ["serde", "cst"] }
nucleo-matcher = "0.3.1"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tui-textarea-2 = "0.12.1"

[dev-dependencies]
portable-pty = "0.9.0"
unicode-width = "0.2.2"
